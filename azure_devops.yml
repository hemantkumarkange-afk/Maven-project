# Scripting option 1 (Main script)
# ============================================================
# Maven Project - Complete CI/CD Pipeline
# ============================================================
trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Maven Version
  MAVEN_REVISION: '1.$(Build.BuildId)'

  # Azure Artifacts Maven Feed
  azureArtifactsFeed: 'finance-1st-project-hemantkumar'
  azureArtifactsUrl: 'https://pkgs.dev.azure.com/finance-1st-project-hemantkumar/hemantkumar1stproject/_packaging/finance-1st-project-hemantkumar/maven/v1'

  # Maven Coordinates
  mavenGroupId: 'com.example'
  mavenArtifactId: 'webapp'

steps:

# Generate Date + Build ID Based Maven Version
- script: |
    BUILD_VERSION="1.$(date +%Y%m%d%H%M).$(Build.BuildId)"
    echo "Generated Maven Version: $BUILD_VERSION"
    echo "##vso[task.setvariable variable=MAVEN_REVISION]$BUILD_VERSION"
  displayName: 'Generate Date Based Maven Version'

# Validate Maven Project
- script: |
    mvn -Drevision=$(MAVEN_REVISION) validate
  displayName: 'Validate Maven Project'

# Compile Maven Project
- script: |
    mvn -Drevision=$(MAVEN_REVISION) compile
  displayName: 'Compile Maven Project'

# Unit Test
- script: |
    mvn -Drevision=$(MAVEN_REVISION) test
  displayName: 'Unit Test Framework Maven Project'

# Set Dynamic Maven Version
- script: |
    mvn versions:set -DnewVersion=$(MAVEN_REVISION)
  displayName: 'Set Maven Project Dynamic Version'

# Generate WAR Artifact
- script: |
    mvn -Drevision=$(MAVEN_REVISION) package
  displayName: 'Generate Build Package/Artifact Maven Project'
  env:
    MAVEN_OPTS: -DskipTests=true

# Install Artifact to Local Maven Repository
- script: |
    mvn -Drevision=$(MAVEN_REVISION) install
  displayName: 'Copy the artifact to local repository'
  env:
    MAVEN_OPTS: -DskipTests=true

# Verify Artifact
- script: |
    mvn -Drevision=$(MAVEN_REVISION) verify
  displayName: 'Verify the artifact/package'
  env:
    MAVEN_OPTS: -DskipTests=true

# Copy WAR to Artifact Staging Directory
- task: CopyFiles@2
  displayName: 'Copy WAR to Artifact Staging'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: '**/target/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true

# Check WAR File
- script: |
    echo "========== WAR CHECK START =========="
    echo "Artifact Staging Directory:"
    ls -la "$(Build.ArtifactStagingDirectory)"

    WAR_FILE=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | head -1)

    if [ -z "$WAR_FILE" ]; then
      echo "ERROR: WAR file not found."
      exit 1
    fi

    echo "WAR file found:"
    echo "$WAR_FILE"
    echo "========== WAR CHECK END =========="
  displayName: 'Verify WAR Artifact'

# Upload WAR to Azure Blob Storage
- task: AzureCLI@2
  displayName: 'Upload WAR to Azure Blob Storage'
  inputs:
    azureSubscription: 'Azure-Portal-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "========== Azure Blob Upload START =========="
      set -e

      WAR_COUNT=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | wc -l)

      if [ "$WAR_COUNT" -eq 0 ]; then
        echo "ERROR: No WAR file found."
        exit 1
      fi

      echo "WAR files found: $WAR_COUNT"
      echo "Creating storage container if required..."

      az storage container create \
        --name "$(containerName)" \
        --account-name "$(storageAccountName)" \
        --auth-mode login

      echo "Uploading WAR to Azure Blob Storage..."

      az storage blob upload-batch \
        --account-name "$(storageAccountName)" \
        --destination "$(containerName)" \
        --source "$(Build.ArtifactStagingDirectory)" \
        --pattern "*.war" \
        --auth-mode login \
        --overwrite true

      echo "========== Azure Blob Upload END =========="

# Publish Azure DevOps Pipeline Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Authenticate to Azure Artifacts Maven Feed
- task: MavenAuthenticate@0
  displayName: 'Authenticate to Azure Artifacts Maven Feed'
  inputs:
    artifactsFeeds: '$(azureArtifactsFeed)'

# Publish WAR to Azure Artifacts Maven Feed
# No permanent pom.xml changes required
- script: |
    echo "========== Azure Artifacts Maven Upload START =========="
    set -e

    echo "Feed: $(azureArtifactsFeed)"
    echo "Maven Version: $(MAVEN_REVISION)"
    echo "Artifact Staging Directory:"
    ls -la "$(Build.ArtifactStagingDirectory)"

    # Find WAR file
    WAR_FILE=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | head -1)

    if [ -z "$WAR_FILE" ]; then
      echo "ERROR: WAR file not found."
      exit 1
    fi

    echo "WAR file selected:"
    echo "$WAR_FILE"

    # Create temporary POM
    echo "Creating temporary POM..."

    cat > "$(Build.ArtifactStagingDirectory)/upload-pom.xml" <<EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <project xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
    <modelVersion>4.0.0</modelVersion>
    <groupId>$(mavenGroupId)</groupId>
    <artifactId>$(mavenArtifactId)</artifactId>
    <version>$(MAVEN_REVISION)</version>
    <packaging>war</packaging>
    </project>
    EOF

    echo "Temporary POM created successfully."

    # Deploy WAR to Azure Artifacts
    echo "Uploading WAR to Azure Artifacts Maven Feed..."

    mvn -e deploy:deploy-file \
      -Dfile="$WAR_FILE" \
      -DpomFile="$(Build.ArtifactStagingDirectory)/upload-pom.xml" \
      -DrepositoryId="$(azureArtifactsFeed)" \
      -Durl="$(azureArtifactsUrl)"

    echo "========== Azure Artifacts Maven Upload END =========="
  displayName: 'Deploy WAR to Azure Artifacts Maven Feed'


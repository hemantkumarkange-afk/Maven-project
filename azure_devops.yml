# Scripting option 1 (Main script)

trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureArtifactsFeed: 'hemantkumar1stproject'
  azureArtifactsUrl: 'https://pkgs.dev.azure.com/finance-1st-project-hemantkumar/hemantkumar1stproject/_packaging/hemantkumar1stproject/maven/v1'

steps:

# Generate Date Based Maven Version
- script: |
    BUILD_VERSION="1.$(date +%Y%m%d%H%M).$(Build.BuildId)"
    echo "Generated Maven Version: $BUILD_VERSION"
    echo "##vso[task.setvariable variable=MAVEN_REVISION]$BUILD_VERSION"
  displayName: 'Generate Date Based Maven Version'

# Validate Maven Project
- script: |
    mvn validate
  displayName: 'Validate Maven Project'

# Compile Maven Project
- script: |
    mvn compile
  displayName: 'Compile Maven Project'

# Unit Test
- script: |
    mvn test
  displayName: 'Unit Test Maven Project'

# Set Dynamic Maven Version
- script: |
    echo "Setting Maven Version to: $(MAVEN_REVISION)"
    mvn versions:set -DnewVersion=$(MAVEN_REVISION)
  displayName: 'Set Dynamic Maven Version'

# Generate WAR Artifact
- script: |
    mvn package -DskipTests=true
  displayName: 'Generate WAR Package'



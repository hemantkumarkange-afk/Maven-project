# Publish Azure DevOps Pipeline Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Authenticate to Azure Artifacts Maven Feed
- task: MavenAuthenticate@0
  displayName: 'Authenticate to Azure Artifacts Maven Feed'
  inputs:
    artifactsFeeds: '$(azureArtifactsFeed)'

# Upload WAR to Azure Artifacts Maven Feed
- script: |
    echo "========== Azure Artifacts Upload START =========="
    set -e

    echo "Feed: $(azureArtifactsFeed)"
    echo "Version: $(MAVEN_REVISION)"
    echo "Group ID: $(mavenGroupId)"
    echo "Artifact ID: $(mavenArtifactId)"

    echo "Checking Artifact Staging Directory:"
    ls -la "$(Build.ArtifactStagingDirectory)"

    WAR_FILE=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | head -1)

    if [ -z "$WAR_FILE" ]; then
      echo "ERROR: WAR file not found."
      exit 1
    fi

    echo "WAR file selected:"
    echo "$WAR_FILE"

    echo "Uploading WAR to Azure Artifacts Maven Feed..."

    # Create temporary POM in staging directory (keeps your project repository clean)
    echo "Creating temporary POM..."
    cat > "$(Build.ArtifactStagingDirectory)/upload-pom.xml" <<EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <project xmlns="http://apache.org"
             xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
             xsi:schemaLocation="http://apache.org https://apache.org">
      <modelVersion>4.0.0</modelVersion>
      <groupId>$(mavenGroupId)</groupId>
      <artifactId>$(mavenArtifactId)</artifactId>
      <version>$(MAVEN_REVISION)</version>
      <packaging>war</packaging>
    </project>
    EOF
    echo "Temporary POM created at $(Build.ArtifactStagingDirectory)/upload-pom.xml"

    # Determine Maven settings path
    SETTINGS_FILE="$MAVEN_SETTINGS_PATH"
    if [ -z "$SETTINGS_FILE" ] || [ ! -f "$SETTINGS_FILE" ]; then
      if [ -f "$HOME/.m2/settings.xml" ]; then
        SETTINGS_FILE="$HOME/.m2/settings.xml"
      else
        SETTINGS_FILE=""
      fi
    fi

    echo "MAVEN_SETTINGS_PATH=$SETTINGS_FILE"
    if [ -n "$SETTINGS_FILE" ]; then
      ls -la "$SETTINGS_FILE" || true
      echo "---- settings.xml (first 200 lines) ----"
      sed -n '1,200p' "$SETTINGS_FILE" || true
    else
      echo "No settings.xml found. Maven will run without custom settings."
    fi

    set +e
    if [ -n "$SETTINGS_FILE" ]; then
      MVN_SETTINGS_ARG="-s \"$SETTINGS_FILE\""
    else
      MVN_SETTINGS_ARG=""
    fi

    # FIX: -DrepositoryId incorporates your exact feed token "finance-1st-project-hemantkumar"
    eval mvn -B $MVN_SETTINGS_ARG -f "$(Build.ArtifactStagingDirectory)/upload-pom.xml" deploy:deploy-file \
      -Dfile="$WAR_FILE" \
      -Dpackaging=war \
      -DrepositoryId="finance-1st-project-hemantkumar" \
      -Durl="$(azureArtifactsUrl)" \
      -DskipTests=true -DinteractiveMode=false
    DEPLOY_EXIT_CODE=$?
    set -e

    if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
      echo "Maven deploy failed with exit code $DEPLOY_EXIT_CODE. Attempting fallback to storage upload (if key provided)..."
      
      # FIX: Adjusted shell variable context checking structure to avoid syntax command parsing errors
      if [ -n "$(azureStorageAccountKey)" ]; then
        az storage blob upload --account-name "$(storageAccountName)" --container-name "$(containerName)" --file "$WAR_FILE" --auth-mode key --account-key "$(azureStorageAccountKey)" --overwrite true
        echo "Fallback upload completed."
      else
        echo "No storage account key provided; fallback skipped."
      fi
      exit $DEPLOY_EXIT_CODE
    fi

    echo "========== Azure Artifacts Upload END =========="
  displayName: 'Deploy WAR to Azure Artifacts Maven Feed'

  

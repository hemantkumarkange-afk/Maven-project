# Copy WAR to Artifact Staging Directory
- task: CopyFiles@2
  displayName: 'Copy WAR to Artifact Staging'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: '**/target/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true

# Verify WAR Artifact
- script: |
    echo "========== WAR CHECK START =========="
    ls -la "$(Build.ArtifactStagingDirectory)"
    WAR_FILE=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | head -1)
    if [ -z "$WAR_FILE" ]; then
      echo "ERROR: WAR file not found."
      exit 1
    fi
    echo "WAR file found:"
    echo "$WAR_FILE"
    echo "========== WAR CHECK END =========="
  displayName: 'Verify WAR Artifact'

# Publish Azure DevOps Pipeline Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Authenticate to Azure Artifacts Maven Feed
- task: MavenAuthenticate@0
  displayName: 'Authenticate to Azure Artifacts Maven Feed'
  inputs:
    artifactsFeeds: '$(azureArtifactsFeed)'

# Deploy Maven Package to Azure Artifacts
- script: |
    echo "========== Azure Artifacts Deploy START =========="
    echo "Feed: $(azureArtifactsFeed)"
    echo "Maven Version: $(MAVEN_REVISION)"
    mvn deploy -DskipTests=true
    echo "Maven package deployed successfully."
    echo "========== Azure Artifacts Deploy END =========="
  displayName: 'Deploy Maven Package to Azure Artifacts Feed'


# Scripting option 1 (Main script)

trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'                   # Use MS-hosted Ubuntu agent

variables:
  # Date based Maven version
  # Example: 1.20260810.123
  MAVEN_REVISION: '1.$(Build.BuildId)'

steps:

# Generate Date + Build ID based Maven Version
- script: |
    BUILD_VERSION="1.$(date +%Y%m%d%H%M).$(Build.BuildId)"
    echo "Generated Maven Version: $BUILD_VERSION"
    echo "##vso[task.setvariable variable=MAVEN_REVISION]$BUILD_VERSION"
  displayName: 'Generate Date Based Maven Version'


- script: mvn -Drevision=$(MAVEN_REVISION) validate
  displayName: 'Validate Maven Project'


- script: mvn -Drevision=$(MAVEN_REVISION) compile
  displayName: 'Compile Maven Project'


- script: mvn -Drevision=$(MAVEN_REVISION) test
  displayName: 'Unit Test Framework Maven Project'


- script: mvn versions:set -DnewVersion=$(MAVEN_REVISION)
  displayName: 'Set Maven Project Dynamic Version'


- script: mvn -Drevision=$(MAVEN_REVISION) package
  displayName: 'Generate Build Package/Artifact Maven Project'
  env:
    MAVEN_OPTS: -DskipTests=true     # Skip tests while building the artifact/package


- script: mvn -Drevision=$(MAVEN_REVISION) install
  displayName: 'Copy the artifact to local repository'
  env:
    MAVEN_OPTS: -DskipTests=true

- script: mvn -Drevision=$(MAVEN_REVISION) verify
  displayName: 'Verify the artifact/package'
  env:
    MAVEN_OPTS: -DskipTests=true


- task: CopyFiles@2
  inputs:
    # SourceFolder: '/home/vsts/work/1/s/webapp/target'
    # Adjust the source folder path to match your Maven project structure
    Contents: '**/target/*.war'
    # Adjust pattern to match your build output
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    # '/home/vsts/work/'
    # '$(Build.ArtifactStagingDirectory)'
    # 'c:\agent_work\1\a'
    # Adjust the target folder path to match your desired artifact staging directory

- task: AzureCLI@2
  displayName: 'Upload WAR to Azure Blob Storage'
  inputs:
    azureSubscription: 'Azure-Portal-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az login --service-principal -u $(servicePrincipalId) -p $(servicePrincipalKey) --tenant $(tenantId)
      echo "Uploading WAR file to Azure Blob Storage..."
      az storage blob upload \
        --account-name $(storageAccountName) \
        --container-name $(containerName) \
        --file "$(Build.ArtifactStagingDirectory)/webapp.war" \
        --name "maven-artifact-$(MAVEN_REVISION).war" \
        --auth-mode key 
      echio "WAR file uploaded successfully to Azure Blob Storage."

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    # '/home/vsts/work/'
    # '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
    


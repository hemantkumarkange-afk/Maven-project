# Scripting option 1 (Main script)

trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_REVISION: '1.$(Build.BuildId)'
  azureArtifactsFeed: 'finance-1st-project-hemantkumar'
  azureArtifactsUrl: 'https://pkgs.dev.azure.com/finance-1st-project-hemantkumar/_packaging/finance-1st-project-hemantkumar/maven/v1'
  mavenGroupId: 'com.example'
  mavenArtifactId: 'webapp'

steps:

# Generate Date Based Maven Version
- script: |
    BUILD_VERSION="1.$(date +%Y%m%d%H%M).$(Build.BuildId)"
    echo "Generated Maven Version: $BUILD_VERSION"
    echo "##vso[task.setvariable variable=MAVEN_REVISION]$BUILD_VERSION"
  displayName: 'Generate Date Based Maven Version'

# Validate Maven Project
- script: |
    mvn -Drevision=$(MAVEN_REVISION) validate
  displayName: 'Validate Maven Project'

# Compile Maven Project
- script: |
    mvn -Drevision=$(MAVEN_REVISION) compile
  displayName: 'Compile Maven Project'

# Unit Test
- script: |
    mvn -Drevision=$(MAVEN_REVISION) test
  displayName: 'Unit Test Framework Maven Project'

# Set Dynamic Maven Version
- script: |
    mvn versions:set -DnewVersion=$(MAVEN_REVISION)
  displayName: 'Set Maven Project Dynamic Version'

# Generate WAR Artifact
- script: |
    mvn -Drevision=$(MAVEN_REVISION) package
  displayName: 'Generate Build Package/Artifact Maven Project'
  env:
    MAVEN_OPTS: -DskipTests=true

# Install Artifact to Local Maven Repository
- script: |
    mvn -Drevision=$(MAVEN_REVISION) install
  displayName: 'Copy the artifact to local repository'
  env:
    MAVEN_OPTS: -DskipTests=true

# Verify Artifact
- script: |
    mvn -Drevision=$(MAVEN_REVISION) verify
  displayName: 'Verify the artifact/package'
  env:
    MAVEN_OPTS: -DskipTests=true

# Copy WAR to Artifact Staging Directory
- task: CopyFiles@2
  displayName: 'Copy WAR to Artifact Staging'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: '**/target/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true

# Verify WAR Artifact
- script: |
    echo "========== WAR CHECK START =========="
    echo "Artifact Staging Directory:"
    ls -la "$(Build.ArtifactStagingDirectory)"

    WAR_FILE=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | head -1)

    if [ -z "$WAR_FILE" ]; then
      echo "ERROR: WAR file not found."
      exit 1
    fi

    echo "WAR file found:"
    echo "$WAR_FILE"
    echo "========== WAR CHECK END =========="
  displayName: 'Verify WAR Artifact'


# Scripting option 1 (Main script)

# Scripting option 1 (Main script)

trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Date + Build ID based Maven Version
  MAVEN_REVISION: '1.$(Build.BuildId)'
  # Azure Artifacts feed and Maven coordinates (override in pipeline variables if needed)
  azureArtifactsFeed: 'finance-1st-project-hemantkumar'
  azureArtifactsUrl: 'https://pkgs.dev.azure.com/finance-1st-project-hemantkumar/_packaging/finance-1st-project-hemantkumar/maven/v1'
  mavenGroupId: 'com.example'
  mavenArtifactId: 'webapp'

steps:

# Generate Date + Build ID based Maven Version
- script: |
    BUILD_VERSION="1.$(date +%Y%m%d%H%M).$(Build.BuildId)"
    echo "Generated Maven Version: $BUILD_VERSION"
    echo "##vso[task.setvariable variable=MAVEN_REVISION]$BUILD_VERSION"
  displayName: 'Generate Date Based Maven Version'


# Validate Maven Project
- script: mvn -Drevision=$(MAVEN_REVISION) validate
  displayName: 'Validate Maven Project'


# Compile Maven Project
- script: mvn -Drevision=$(MAVEN_REVISION) compile
  displayName: 'Compile Maven Project'


# Unit Test
- script: mvn -Drevision=$(MAVEN_REVISION) test
  displayName: 'Unit Test Framework Maven Project'


# Set Dynamic Maven Version
- script: mvn versions:set -DnewVersion=$(MAVEN_REVISION)
  displayName: 'Set Maven Project Dynamic Version'


# Generate WAR Artifact
- script: mvn -Drevision=$(MAVEN_REVISION) package
  displayName: 'Generate Build Package/Artifact Maven Project'
  env:
    MAVEN_OPTS: -DskipTests=true


# Copy artifact to local Maven repository
- script: mvn -Drevision=$(MAVEN_REVISION) install
  displayName: 'Copy the artifact to local repository'
  env:
    MAVEN_OPTS: -DskipTests=true


# Verify Artifact
- script: mvn -Drevision=$(MAVEN_REVISION) verify
  displayName: 'Verify the artifact/package'
  env:
    MAVEN_OPTS: -DskipTests=true


# Copy WAR to Artifact Staging Directory
- task: CopyFiles@2
  displayName: 'Copy WAR to Artifact Staging'
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)'
    Contents: '**/target/*.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    flattenFolders: true


# Upload WAR to Azure Blob Storage
- task: AzureCLI@2
  displayName: 'Upload WAR to Azure Blob Storage'
  inputs:
    azureSubscription: 'Azure-Portal-Service-Connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |

      echo "========== Azure Blob Upload START =========="

      set -e

      WAR_COUNT=$(find "$(Build.ArtifactStagingDirectory)" -type f -name "*.war" | wc -l)

      if [ "$WAR_COUNT" -eq 0 ]; then
        echo "ERROR: No WAR file found in Artifact Staging Directory."
        exit 1
      fi

      az storage container create \
        --name "$(containerName)" \
        --account-name "$(storageAccountName)" \
        --auth-mode login

      az storage blob upload-batch \
        --account-name "$(storageAccountName)" \
        --destination "$(containerName)" \
        --source "$(Build.ArtifactStagingDirectory)" \
        --pattern "*.war" \
        --auth-mode login \
        --overwrite true

      echo "========== Azure Blob Upload END =========="


# Publish Pipeline Artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
    

# Publish WAR(s) to Azure Artifacts Maven feed (no pom.xml changes)
- task: MavenAuthenticate@0
  displayName: 'Authenticate to Azure Artifacts Maven feed'
  inputs:
    artifactsFeeds: '$(azureArtifactsFeed)'

- script: |
    echo "Looking for WAR files in $(Build.ArtifactStagingDirectory)"
    ls -la "$(Build.ArtifactStagingDirectory)" || true
    COUNT=0
    for f in "$(Build.ArtifactStagingDirectory)"/*.war; do
      if [ -f "$f" ]; then
        COUNT=$((COUNT+1))
        echo "Publishing $f to feed $(azureArtifactsFeed)"
        mvn deploy:deploy-file \
          -DgroupId=$(mavenGroupId) \
          -DartifactId=$(mavenArtifactId) \
          -Dversion=$(MAVEN_REVISION) \
          -Dpackaging=war \
          -Dfile="$f" \
          -DrepositoryId=azureArtifacts \
          -Durl="$(azureArtifactsUrl)"
      fi
    done
    if [ "$COUNT" -eq 0 ]; then
      echo "No WAR files found to publish."
    else
      echo "Published $COUNT WAR(s)."
    fi
  displayName: 'Deploy WAR(s) to Azure Artifacts Maven feed'



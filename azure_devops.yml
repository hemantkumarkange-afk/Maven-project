# Scripting option 1 (Main script)

trigger:
- main
- master
- devops

pool:
  vmImage: 'ubuntu-latest'                   #Use MS-hosted Ubuntu agent

steps:
- script: mvn validate
  displayName: 'Validate Maven Project'

- script: mvn compile
  displayName: 'Compile Maven Project'

- script: mvn test
  displayName: 'Unit Test Framework Maven Project'

- script: mvn package
  displayName: 'Generate Build Package/Artifact Maven Project'
  env:
    MAVEN_OPTS: -DskipTests=true     # skip tests while buildinh the artifact/package

- task: copyFiles@2
  inputs:
    #SourceFolder: '$/home/vsts/work/1/s/webapp/target' # Adjust the source folder path to match your Maven project structure
    Contents: '**/target/*.war' #Adjust pattern to match your build output
    TargetFolder: 'c:\agent_work\'   #'$(Build.ArtifactStagingDirectory)' #'c:\agent_work\1\a' # Adjust the target folder path to match your desired artifact staging directory

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'c:\agent_work\'  #'$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
    

